<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>LinkBT – Free URL Shortener & Link Analytics</title>
    <meta name="description" content="LinkBT is a free URL shortener. Create branded short links, track clicks by device, browser & location, and manage all your links from one powerful dashboard." />
    <meta name="keywords" content="URL shortener, link shortener, short URL, custom alias, link analytics, branded links, link management" />
    <meta name="author" content="LinkBT – Intellisoft Technology" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://link.bt/" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkBT" />
    <meta property="og:title" content="Link it short" />
    <meta property="og:description" content="Create branded short links, track clicks by device, browser & location, and manage all your links from one powerful dashboard." />
    <meta property="og:url" content="https://link.bt/" />
    <meta property="og:image" content="https://link.bt/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkBT – Free URL Shortener & Link Analytics" />
    <meta name="twitter:description" content="Create branded short links, track clicks by device, browser & location, and manage all your links from one powerful dashboard." />
    <meta name="twitter:image" content="https://link.bt/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/fevicon.svg" />
    <link rel="apple-touch-icon" href="/fevicon.svg" />

    <!-- Mobile browser tab bar colour -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Preconnect for GSI (performance) -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
